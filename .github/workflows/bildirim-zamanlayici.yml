# Hatırlatma bildirimlerini 15 dakikada bir tetikler. Vercel'in ücretsiz planı zamanlanmış işi
# günde bir kez çalıştırdığı için (vercel.json) sık kontrolü GitHub yapar.
# Depo ayarlarında iki secret gerekir: VANTREL_APP_URL (ör. https://app.vantrelcode.com) ve
# CRON_SECRET (Vercel'deki ile aynı). Yoksa iş hiçbir şey yapmadan biter.
name: Bildirim zamanlayıcı

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tetikle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bildirim işini çağır
        env:
          APP_URL: ${{ secrets.VANTREL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "VANTREL_APP_URL veya CRON_SECRET tanımlı değil; atlandı."
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/notifications"
